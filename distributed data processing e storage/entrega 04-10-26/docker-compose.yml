services:
  spark-jupyter:
    image: quay.io/jupyter/pyspark-notebook:latest
    container_name: spark-jupyter
    ports:
      - "8888:8888"   # Jupyter
      - "4040:4040"   # Spark UI
    volumes:
      - ./:/home/jovyan/work
    command: start-notebook.py --IdentityProvider.token='' --ServerApp.password=''
